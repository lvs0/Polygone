[package]
name = "polygone-crypto"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Primitives cryptographiques post-quantiques pour Polygone"

[dependencies]
polygone-common = { path = "../common" }

# Post-quantum KEM
generic-array = "0.14"
aes-gcm = { version = "0.10", features = ["aes"] }

# Secret sharing — need `std` feature for `dealer()` method
sharks = { version = "0.5", default-features = false, features = ["std"] }

# Hashing
blake3 = "1"

# Serialization for Fragment type
serde = { version = "1", features = ["derive"] }

# Général
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
sys-info = "0.9"

[[bench]]
name = "crypto_ops"
harness = false
