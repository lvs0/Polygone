[package]
name = "msh"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
libp2p = { version = "0.53", default-features = false, features = ["kad", "request-response"] }
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "2.2"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
