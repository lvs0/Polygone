<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Polygone Favicon">
  <title>⬡ Polygone</title>
  <desc>Polygone hexagon favicon — post-quantum privacy</desc>

  <defs>
    <linearGradient id="f-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#05050f" rx="4"/>

  <!-- Main hexagon -->
  <g filter="url(#f-glow)">
    <polygon points="16,3 28,10 28,22 16,29 4,22 4,10"
             fill="url(#f-hex)" opacity="0.9"/>
    <!-- Top facet highlight -->
    <polygon points="16,3 28,10 16,16"
             fill="white" opacity="0.1"/>
  </g>

  <!-- Inner void (center black hex) -->
  <polygon points="16,12 21,15 21,21 16,24 11,21 11,15"
           fill="#05050f"/>

  <!-- Center dot (the key) -->
  <circle cx="16" cy="18" r="1.5" fill="#00c8ff" opacity="0.9"/>

  <!-- 3 dispersion dots around the center -->
  <circle cx="19" cy="15" r="0.8" fill="#00c8ff" opacity="0.7"/>
  <circle cx="13" cy="21" r="0.8" fill="#00aaff" opacity="0.7"/>
  <circle cx="19" cy="21" r="0.8" fill="#0055ff" opacity="0.6"/>
</svg>