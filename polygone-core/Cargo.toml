[package]
name = "polygone-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Lévy <polygone@proton.me>"]
description = "⬡ Polygone Core — the organism's nervous system"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.56", features = ["kad", "noise", "tcp", "yamux", "identify"] }
ml-kem = "0.2"
ml-dsa = "0.2"
aes-gcm = "0.10"
blake3 = "1.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
