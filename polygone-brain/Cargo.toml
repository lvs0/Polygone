[package]
name = "polygone-brain"
version = "0.1.0"
edition = "2021"
authors = ["l-vs (Hope)"]

[dependencies]
polygone = { path = "../polygone-core" }
polygone-petals = { path = "../polygone-petals" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# candle-core = "0.3" # Disabled due to build environment issues
