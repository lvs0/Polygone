[workspace]
resolver = "2"
members = [
    "polygone-core",
    "polygone-shell",
    "polygone-petals",
    "polygone-brain",
    "crates/app",
    "crates/common",
    "crates/crypto",
    "crates/msh",
    "crates/network",
    "crates/msg",
    "examples",
]
# polygone-petals exclu temporairement : bug incompatibilité candle-core / rand 0.9
exclude = [
    "target",
]

[workspace.dependencies]
blake3 = "1.5"
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1